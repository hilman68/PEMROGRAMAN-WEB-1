<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Debugging JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="foto.png" alt="Deskripsi gambar" >
        <h1>Sistem Nilai Mahasiswa</h1>
        <P>Praktikum Developer Tools dan Debugging</P>
        <label>Nama Mahasiswa</label>
        <input type="text" id="nama" placeholder="Masukkan Nama">
        <label>Nilai Tugas</label>
        <input type="number" id="tugas" placeholder="0 - 100">
        <label>Nilai UTS</label>
        <input type="number" id="uts" placeholder="0 - 100">
        <label>Nilai UAS</label>
        <input type="number" id="uas" placeholder="0 - 100">
        <button type="button" class="btn-hitung" onclick="hitungnilai()">Hitung</button>
        <button type="button" class="btn-hapus" onclick="hapusData()">Hapus</button>
        <div id="hasil">hasil perhitungan akan tampil disini</div>
    </div>
<script src="script.js"></script>
</body>
</html
